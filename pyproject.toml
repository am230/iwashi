[project]
name = "iwashi"
version = "3.2.4"
description = "プロフィールの取得を一つのライブラリで可能にします。"
authors = [
    { name = "am230", email = "111672334+am230@users.noreply.github.com" },
]
dependencies = ["aiohttp>=3.9.5", "bs4>=0.0.2", "loguru>=0.7.2", "click>=8.1.7"]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.pip]
universal = true

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "ruff>=0.4.4",
    "typingdict>=0.1.3",
    "build>=1.2.1",
    "strinpy>=0.0.4",
    "astor>=0.8.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "pyright>=1.1.362",
    "requests>=2.31.0",
    "pytest-xdist>=3.6.1",
    "pytest>=9.0.3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["src"]